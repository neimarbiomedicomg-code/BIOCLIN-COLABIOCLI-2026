<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo Bioclin Feiras</title>
<style>
/* Layout: app de tablet offline — barra superior, cartões grandes de toque, barra de ação fixa no rodapé da linha */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#18264a; --muted:#5f6471; --line:#dedee2;
  --accent:#22366a; --accent-ink:#ffffff; --brand2:#8394ab; --hum:#22366a; --vet:#2c7a4c;
  --hot:#bf3f0e; --warm:#a86d12; --cold:#5f6e80; --soft:#f3f3f5;
  --f-display:"Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto;background:none;border:0;padding:0;text-align:left}
.brand img{height:36px;width:auto;display:block;margin-bottom:2px}
.top{border-bottom:3px solid var(--accent)!important}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.count{font-family:var(--f-mono);font-size:12px;background:var(--soft);border-radius:999px;padding:1px 8px}
main{max-width:1120px;margin:0 auto;padding:20px 16px 150px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.lead-in{max-width:62ch;color:var(--muted);margin:6px 0 0}
.grid{display:grid;gap:14px;margin-top:20px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px 20px 26px;display:flex;flex-direction:column;gap:8px;min-height:150px;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--div,var(--accent))}
.tile h2{font-size:28px} .tile h3{font-size:22px}
.tile p{margin:0;color:var(--muted)}
.tile .meta{margin-top:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.d-hum{--div:var(--hum)} .d-vet{--div:var(--vet)}
.head-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.search{flex:1 1 260px;max-width:380px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;min-height:46px}
.tbl-wrap{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
.code{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.pname{font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:1px 6px}
.note{margin-top:12px;font-size:14px;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1120px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
th.sel,td.sel{width:56px;padding-left:14px;padding-right:4px}
.add{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--accent);line-height:0;display:inline-flex;align-items:center;justify-content:center}
.add svg{width:21px;height:21px}
.add.on{background:var(--accent);border-color:var(--accent);color:#fff}
.quick{margin-top:18px}
.quick fieldset{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.cartbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.hintwa{font-weight:400;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.fold{border:1px solid var(--line);border-radius:14px;padding:4px 16px;background:var(--surface)}
.fold summary{font-weight:600;padding:12px 0;cursor:pointer;min-height:46px;display:flex;align-items:center}
.fold fieldset{border:0;padding:0 0 14px}
.cartbar button{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;min-height:40px}
.rm{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;line-height:1}
.btn.primary .count{background:rgba(255,255,255,.24);color:#fff}
.dock .btn{flex:1 1 220px;font-size:17px;min-height:56px}
.overlay{position:fixed;inset:0;z-index:10;background:rgba(6,18,24,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:26px}
.qrbox{background:#fff;border-radius:12px;padding:16px;align-self:center;line-height:0}
.qrbox canvas{width:320px;height:320px;max-width:72vw;max-height:72vw;image-rendering:pixelated}
.url{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-all;background:var(--soft);padding:8px 10px;border-radius:8px;max-height:90px;overflow:auto}
dl.spec{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
dl.spec dt{color:var(--muted);font-size:14px} dl.spec dd{margin:0}
form{display:flex;flex-direction:column;gap:18px;margin-top:18px}
fieldset{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px;margin:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
legend{font-family:var(--f-display);font-weight:700;font-size:18px;padding:0 6px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;min-height:46px;color:var(--ink);font-weight:400;font-size:16px;width:100%}
.req{color:var(--hot)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0}
.chip span{display:inline-flex;align-items:center;min-height:42px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px;color:var(--ink)}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp-label{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.consent input{width:24px;height:24px;flex:none;margin-top:1px}
.err{color:var(--hot);font-size:15px;font-weight:600;margin:0}
.ok{color:var(--vet);font-size:15px;font-weight:600;margin:0}
.done{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.done h2{font-size:28px}
pre.summary{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--soft);border-radius:8px;padding:12px;margin:0;max-height:300px;overflow:auto}
.score{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.score::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-quente{color:var(--hot)} .s-morno{color:var(--warm)} .s-frio{color:var(--cold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--muted);margin-top:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.warn{background:#fff4e5;border:1px solid #f0c890;color:#6b4300;border-radius:10px;padding:12px 14px;font-size:15px}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;margin:0 -16px;-webkit-overflow-scrolling:touch}
.slider::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;scroll-snap-align:start;padding:0 16px;min-width:0}
.hero{background:none;color:var(--ink);border-radius:0;padding:12px 0 8px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{display:none}
.hero .eyebrow{color:var(--muted)}
.hero h1{font-size:44px;max-width:18ch;position:relative;color:var(--accent)}
.hero p{margin:0;max-width:60ch;font-size:17px;color:var(--ink);position:relative}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.about-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,.9fr);gap:28px;align-items:start}
.col{min-width:0;border-top:2px solid var(--accent);padding-top:14px}
.hero{padding-top:0!important}
.div-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.div-card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 34px 14px 18px;display:flex;flex-direction:column;gap:4px;border-left:5px solid var(--div)}
.div-card b{font-family:var(--f-display);font-size:19px;color:var(--ink)}
.div-card span{font-size:14px;color:var(--muted)}
.div-card small{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--div);font-weight:700;margin-top:4px}
.div-card i,.lines-list i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:22px;color:var(--brand2)}
.lines-list button{position:relative;width:100%;text-align:left;background:none;border:0;padding:10px 26px 10px 0;text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:14px;color:var(--accent);min-height:42px}
.lines-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.lines-list li{border-bottom:1px solid var(--line)}
.lines-list li:last-child{border-bottom:0}
@media (max-width:980px){.about-grid{grid-template-columns:1fr 1fr}.about-grid .hero{grid-column:1/-1}}
@media (max-width:620px){.about-grid{grid-template-columns:1fr}}
.lines-cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lines-cloud span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--accent)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dots button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:var(--line)}
.dots button[aria-current="true"]{background:var(--accent);width:28px;border-radius:6px}
.hint{color:var(--muted);font-size:14px}
@media (max-width:560px){.hero{padding:8px 0}.hero h1{font-size:32px}
.tile h2{font-size:24px}.dock .btn{flex:1 1 calc(50% - 5px);font-size:14px;padding:10px 6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

		}
		offset += dcCount;

		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

/* um ajuste salvo em branco não pode apagar o valor que já vem no arquivo */
function mergeCfg(base, saved){
  const out = Object.assign({}, base);
  Object.keys(saved || {}).forEach(k => {
    const v = saved[k];
    if (v === "" || v == null) return;
    if (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length) return;
    out[k] = v;
  });
  return out;
}

const ICO_CART = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.5" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.6 11.1a1.7 1.7 0 0 0 1.7 1.3h8.3a1.7 1.7 0 0 0 1.7-1.3L21 7.2H6"/></svg>`;
const ICO_OK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.6l5.2 5.2L20 6.4"/></svg>`;
const prodOf = c => PRODUCTS.find(p => p.code === c);
const inCart = c => state.cart.includes(c);
const cartProds = () => state.cart.map(prodOf).filter(Boolean);
function toggleCart(c){
  state.cart = inCart(c) ? state.cart.filter(x => x !== c) : state.cart.concat([c]);
  store(KEY_CART, state.cart); paintAdd(c); refreshDock();
}
function clearCart(){ state.cart = []; store(KEY_CART, state.cart); }
function paintAdd(c){
  document.querySelectorAll(`[data-add="${CSS.escape(c)}"]`).forEach(b => {
    const on = inCart(c);
    b.classList.toggle("on", on); b.innerHTML = on ? ICO_OK : ICO_CART;
    b.setAttribute("aria-pressed", String(on));
    b.setAttribute("aria-label", on ? t("cart_remove") : t("cart_add"));
  });
}
function cartDock(){
  if (!state.cart.length || state.route === "cart" || state.route === "lead-cart") return;
  const q = $("#b-qr2"); if (q) q.classList.remove("primary");   // a proposta passa a ser a ação principal
  $("#dock-in").insertAdjacentHTML("beforeend",
    `<button type="button" class="btn primary cart-go" data-go="cart">${t("cart_view")} <span class="count">${state.cart.length}</span></button>`);
  $("#dock").hidden = false;
}
function refreshDock(){
  const b = $("#dock-in .cart-go"); if (b) b.remove();
  const q = $("#b-qr2"); if (q && !state.cart.length) q.classList.add("primary");
  cartDock();
  if (!$("#dock-in").children.length) $("#dock").hidden = true;
}

function go(r){ state.route = r; closeSheet(); render(); window.scrollTo(0,0); }

function render(){
  document.documentElement.lang = state.lang === "es" ? "es" : "pt-BR";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  ["pt","es"].forEach(l => $("#lang-"+l).setAttribute("aria-pressed", String(state.lang===l)));
  $("#leads-count").textContent = state.leads.length;
  if (CLIENTE) { $("#leads-btn").hidden = true; $("#cfg-btn").hidden = true; }
  $("#dock").hidden = true; $("#dock-in").innerHTML = "";
  const p = state.route.split("-");
  if (state.route === "leads") viewLeads();
  else if (state.route === "cfg") viewCfg();
  else if (state.route === "cart") viewCart();
  else if (state.route === "lead-cart") viewForm(null, null);
  else if (p[0] === "lin" && lineOf(p[1])) viewLineDiv(p[1]);
  else if (p[0] === "div" && divOf(p[1]) && p[1] !== "all") viewDivision(p[1]);
  else if (p[0] === "cat" && divOf(p[1]) && lineOf(p[2])) viewLine(p[1], p[2]);
  else if (p[0] === "lead" && divOf(p[1]) && lineOf(p[2])) viewForm(p[1], p[2]);
  else viewHome(state.route === "divs" ? 1 : 0);
  cartDock();
}

/* ---------- QR codes ---------- */
function drawQR(target, text){
  const L = window.QRLib, q = new L.QRCode(-1, text.length > 300 ? L.ECL.L : L.ECL.M);
  q.addData(text); q.make();
  const n = q.getModuleCount(), quiet = 4, px = Math.max(4, Math.floor(640 / (n + quiet*2)));
  const size = (n + quiet*2) * px, c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,size,size); g.fillStyle = "#0b1f29";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r,k)) g.fillRect((k+quiet)*px, (r+quiet)*px, px, px);
  target.appendChild(c);
}

/* monta o texto do pedido; corta a lista se o link ficar longo demais */
function propText(d, limit, wrap){
  const all = cartList();
  for (let cut = 0; ; cut++){
    const list = cut ? all.slice(0, all.length - cut) : all;
    const quem = [
      d.nome ? t("name") + ": " + d.nome : "",
      d.empresa ? t("company") + ": " + d.empresa : "",
      d.pais ? t("country") + ": " + d.pais : "",
      d.whatsapp ? t("whats") + ": " + d.whatsapp : "",
      d.email ? t("email") + ": " + d.email : "",
      d.perfil ? t("m_profile") + ": " + t("p_" + d.perfil) : "",
      d.prazo ? t("m_when") + ": " + t(d.prazo) : ""
    ].filter(Boolean).join("\n");
    const txt = [
      t("wa_head") + " — " + state.cfg.evento,
      quem,
      t("prods") + " (" + all.length + "):\n" + list.join("\n") + (cut ? "\n" + t("cart_more").replace("{n}", cut) : "")
    ].filter(Boolean).join("\n\n");
    const out = wrap(txt);
    if (out.length <= limit || list.length <= 1) return out;
  }
}

function scoreOf(l){
  const strong = ["dist","ind"].includes(l.perfil);
  const buying = l.tipo.includes("quote") || l.tipo.includes("sample") || l.tipo.includes("dist");
  if ((strong && l.prazo === "w1") || (buying && l.prazo === "w1") || (buying && ["v2","v3"].includes(l.volume))) return "quente";
  if (strong || l.prazo === "w2" || buying || l.tipo.includes("info")) return "morno";
  return "frio";
}

  const fd = new FormData($("#lf"));

    origem: div ? "catalogo" : "proposta", vendedor: state.qr.vend, divisaoOrigem: div || "", linhaOrigem: line || "",

    perfil:v("perfil"), divisoes:all("divs"), linhas:all("linhas"), produtos:all("produtos"), tipo:all("tipo"),
    atuaIVD:v("ivd"), marcas:v("marcas"), equipamentos:v("equipamentos"), volume:v("volume"),

function summary(l){
  return [
    `${t("name")}: ${l.nome}${l.cargo?" ("+l.cargo+")":""}`,
    `${t("company")}: ${l.empresa} - ${l.cidade?l.cidade+", ":""}${l.pais}`,
    `${t("email")}: ${l.email}${l.whatsapp?" | "+t("whats")+": "+l.whatsapp:""}`,
    `${t("profile")}: ${t("p_"+l.perfil)}`,
    `${t("lines_int")}: ${(l.linhas||[]).map(x=>nm(lineOf(x))).join(", ")} (${(l.divisoes||[]).map(x=>nm(divOf(x))).join(", ")})`,
    l.produtos?.length ? `${t("prods")}:\n` + l.produtos.map(c => { const p = prodOf(c); return "  - " + (p ? p.code+" · "+nm(p) : c); }).join("\n") : "",
    l.tipo?.length ? `${t("type")}: ${l.tipo.map(x=>t("t_"+x)).join(", ")}` : "",
    l.atuaIVD ? `${t("ivd")} ${l.atuaIVD==="sim"?t("yes"):t("no")}` : "",
    l.marcas ? `${t("brands")}: ${l.marcas}` : "", l.equipamentos ? `${t("equip")}: ${l.equipamentos}` : "",
    l.volume ? `${t("volume")}: ${t(l.volume)}` : "",
    l.registro ? `${t("regq")} ${l.registro==="sim"?t("yes"):t("no")}` : "", l.cobertura ? `${t("cover")}: ${l.cobertura}` : "",
    l.prazo ? `${t("when")} ${t(l.prazo)}` : "", l.obs ? `${t("obs")}: ${l.obs}` : "",
    l.nota ? `${t("seller_note")}: ${l.nota}` : "",
    `${l.evento} | ${(l.criadoEm||"").slice(0,16).replace("T"," ")}`
  ].filter(Boolean).join("\n");
}

function exportCSV(){
  const cols = ["criadoEm","score","origem","vendedor","nome","cargo","empresa","pais","cidade","email","whatsapp","perfil","divisoes","linhas","produtos","tipo","atuaIVD","marcas","equipamentos","volume","registro","cobertura","prazo","obs","nota","idioma","evento"];
  const cell = x => '"' + String(Array.isArray(x) ? x.join("; ") : (x ?? "")).replace(/"/g,'""') + '"';
  const csv = "\ufeff" + cols.join(";") + "\n" + state.leads.map(l => cols.map(c => cell(l[c])).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = "leads-" + state.cfg.evento.replace(/[^\w-]+/g,"-").toLowerCase() + "-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

    DIVS.forEach(d => LINES.forEach(l => { const k = d.id+"-"+l.id, x = v("link_"+k); if (x) links[k] = x; }));
    state.cfg = { evento:v("evento")||DEFAULTS.evento, email:v("email")||DEFAULTS.email, whatsapp:normWa(v("whatsapp")), responsavel:v("responsavel"), prazo:v("prazo"),
      linkCatalogo:v("linkCatalogo"), linkFormulario:v("linkFormulario"), links };
    store(KEY_CFG, state.cfg);
    $("#cfg-ok").hidden = false;
    if ($("#cfg-ok2")) $("#cfg-ok2").hidden = false;
  });
}

/* ---------- Voltar deslizando para a direita ---------- */
function backRoute(){
  const p = state.route.split("-");
  if (state.route === "" ) return null;
  if (state.route === "leads" || state.route === "cfg" || state.route === "divs" || state.route === "cart") return "";
  if (state.route === "lead-cart") return "cart";
  if (p[0] === "lead") return "cat-" + p[1] + "-" + p[2];
  if (p[0] === "cat")  return p[1] === "all" ? "lin-" + p[2] : "div-" + p[1];
  if (p[0] === "lin")  return "";
  if (p[0] === "div")  return "divs";
  return null;
}
let swX = 0, swY = 0, swT = 0, swOK = false, swPanel = -1;
document.addEventListener("touchstart", e => {
  swOK = false;
  if (e.touches.length !== 1) return;
  if (e.target.closest("input,textarea,select,#overlay")) return;
  const tw = e.target.closest(".tbl-wrap");            // tabela rolada para o lado: deixa a tabela voltar primeiro
  if (tw && tw.scrollLeft > 2) return;
  const p = e.touches[0], sl = $("#slider");
  swX = p.clientX; swY = p.clientY; swT = Date.now(); swOK = true;
  swPanel = sl ? Math.round(sl.scrollLeft / sl.clientWidth) : -1;
}, {passive:true});
document.addEventListener("touchend", e => {
  if (!swOK) return; swOK = false;
  if (!$("#overlay").hidden) return;
  const p = e.changedTouches[0], dx = p.clientX - swX, dy = p.clientY - swY;
  if (dx < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - swT > 900) return;
  const sl = $("#slider");
  if (sl && document.body.contains(sl)) {             // na home: volta do painel de divisões para "Sobre a Bioclin"
    if (swPanel >= 1) sl.scrollTo({left: 0, behavior: "smooth"});
    return;
  }
  const r = backRoute();
  if (r !== null) go(r);
}, {passive:true});

/* ---------- Eventos ---------- */
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); } });
$("#home-btn").onclick = () => go("");
$("#leads-btn").onclick = () => go("leads");
$("#cfg-btn").onclick = () => go("cfg");
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { state.lang = b.dataset.lang; render(); });

/* ---------- Rastreio vindo do QR ---------- */
state.qr = { feira:QS.get("feira")||"", vend:QS.get("vend")||"", div:QS.get("div")||"", linha:QS.get("linha")||"" };
if (QS.get("lang") === "es") state.lang = "es";
if (state.qr.feira) state.cfg.evento = state.qr.feira;          // só nesta sessão; não grava sobre os Ajustes
if (lineOf(state.qr.linha)) state.route = "cat-" + (divOf(state.qr.div) ? state.qr.div : "all") + "-" + state.qr.linha;
else if (divOf(state.qr.div) && state.qr.div !== "all") state.route = "div-" + state.qr.div;
render();
</script>
</body>
